<!DOCTYPE html>
<html lang="it">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Registro Presenze</title>
  
  <!-- LIBRERIA PER ESPORTARE IN EXCEL (.xlsx) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    body {
      font-family: Arial;
      max-width: 100%;
      margin: 0 auto;
      padding: 10px;
      background: linear-gradient(#f0f8ff, #ffffff);
      box-sizing: border-box;
    }

    h1 {
      font-size: 34px;
      text-align: center;
    }

    h2 {
      font-size: 28px;
      margin-top: 20px;
    }

    input, select, button {
      width: 100%;
      margin: 6px 0;
      padding: 10px;
      font-size: 18px;
      border-radius: 5px;
      box-sizing: border-box;
    }

    button {
      background: #66bfff;   
      color: white;
      border: none;
      font-weight: bold;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      font-size: 20px;
    }

    th, td {
      border: 1px solid #000;
      padding: 10px;
    }

    th {
      background: #ddd;
    }

    #logo {
      display: block;
      max-width: 200px;
      margin: 10px auto 20px auto;
    }
  </style>
</head>
<body>
  <h1>Registro Presenze</h1>

  <!-- Sezione firma -->
  <h2>Segna presenza</h2>
  <input id="nome" placeholder="Nome">
  <input id="cognome" placeholder="Cognome">
  <select id="gruppo">
    <option value="">Seleziona gruppo</option>
    <option value="gruppo 9-12">Gruppo 9–12</option>
    <option value="gruppo 13-20">Gruppo 13–20</option>
    <option value="adulti">Adulti</option> <!-- Corretto il valore duplicato -->
  </select>
  <button onclick="salvaPresenza()">Segna presenza</button>

  <hr>

  <!-- Sezione registro -->
  <h2>Registro per giorno</h2>
  <input type="date" id="dataRegistro">
  <button onclick="mostraRegistro()">Mostra registro</button>
  <button onclick="esportaExcelPerGruppi()">Esporta in Excel (per Gruppi)</button>

 <table id="tabellaRegistro" style="display:none;">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Cognome</th>
        <th>Gruppo</th>
        <th>Data</th>
        <th>Ora</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- Firebase e script -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>

  <!-- INCOLLA QUESTA FUNZIONE QUI DIRETTAMENTE NELL'HTML -->
  <script>
async function esportaExcelPerGruppi() {
  // 1. Chiedi la password all'utente (sostituisci 'laTuaPassword123' con la password che preferisci)
  const passwordInserita = prompt("Inserisci la password per scaricare il file Excel:");

  // Se l'utente preme "Annulla", blocchiamo tutto
  if (passwordInserita === null) {
    return; 
  }

  // 2. Controlla se la password è corretta (puoi cambiarla qui sotto)
  const passwordSegreta = "laTuaPassword123"; 

  if (passwordInserita !== passwordSegreta) {
    alert("Password errata! Accesso negato.");
    return;
  }

  // 3. Se la password è corretta, procede con l'esportazione normale
  console.log("Password corretta, avvio esportazione...");

  if (typeof XLSX === 'undefined') {
    alert("Errore: La libreria XLSX non è definita!");
    return;
  }

  try {
    const snapshot = await db.collection("presenze").get();

    if (snapshot.empty) {
      alert("Nessun dato presente nel database da esportare.");
      return;
    }

    let datiPerGruppo = {};

    snapshot.forEach(doc => {
      const d = doc.data();
      let dataFormattata = "Data non valida";
      let oraFormattata = "";
      
      if (d.data) {
        const dateObj = d.data.toDate ? d.data.toDate() : new Date(d.data);
        if (!isNaN(dateObj)) {
          dataFormattata = dateObj.toLocaleDateString();
          oraFormattata = dateObj.toLocaleTimeString();
        }
      }

      let gruppoNome = d.gruppo ? d.gruppo.trim() : "Senza Gruppo";

      if (!datiPerGruppo[gruppoNome]) {
        datiPerGruppo[gruppoNome] = [
          ["Nome", "Cognome", "Gruppo", "Data", "Ora"]
        ];
      }

      datiPerGruppo[gruppoNome].push([
        d.nome || "", 
        d.cognome || "", 
        d.gruppo || "", 
        dataFormattata, 
        oraFormattata
      ]);
    });

    let wb = XLSX.utils.book_new();

    for (let gruppo in datiPerGruppo) {
      let ws = XLSX.utils.aoa_to_sheet(datiPerGruppo[gruppo]);
      let nomeFoglioSafe = gruppo.substring(0, 31).replace(/[:\\\/?*\[\]]/g, "_");
      XLSX.utils.book_append_sheet(wb, ws, nomeFoglioSafe);
    }

    XLSX.writeFile(wb, "registro_presenze_per_gruppi.xlsx");
    alert("File Excel scaricato con successo!");

  } catch (err) {
    console.error("Errore esportazione Excel:", err);
    alert("Errore durante l'esportazione. Controlla la console.");
  }
}
<script>
