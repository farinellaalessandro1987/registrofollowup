<!DOCTYPE html>
<html lang="it">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Registro Presenze</title>
  
  <!-- LIBRERIA PER ESPORTARE IN EXCEL (.xlsx) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    body {
      font-family: Arial;
      max-width: 100%;
      margin: 0 auto;
      padding: 10px;
      background: linear-gradient(#f0f8ff, #ffffff);
      box-sizing: border-box;
    }

    h1 {
      font-size: 34px;
      text-align: center;
    }

    h2 {
      font-size: 28px;
      margin-top: 20px;
    }

    input, select, button {
      width: 100%;
      margin: 6px 0;
      padding: 10px;
      font-size: 18px;
      border-radius: 5px;
      box-sizing: border-box;
    }

    button {
      background: #66bfff;   
      color: white;
      border: none;
      font-weight: bold;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      font-size: 20px;
    }

    th, td {
      border: 1px solid #000;
      padding: 10px;
    }

    th {
      background: #ddd;
    }

    #logo {
      display: block;
      max-width: 200px;
      margin: 10px auto 20px auto;
    }
  </style>
</head>
<body>
  <h1>Registro Presenze</h1>

  <!-- Sezione firma -->
  <h2>Segna presenza</h2>
  <input id="nome" placeholder="Nome">
  <input id="cognome" placeholder="Cognome">
  <select id="gruppo">
    <option value="">Seleziona gruppo</option>
    <option value="gruppo 9-12">Gruppo 9–12</option>
    <option value="gruppo 13-20">Gruppo 13–20</option>
    <option value="adulti">Adulti</option> <!-- Corretto il valore duplicato -->
  </select>
  <button onclick="salvaPresenza()">Segna presenza</button>

  <hr>

  <!-- Sezione registro -->
  <h2>Registro per giorno</h2>
  <input type="date" id="dataRegistro">
  <button onclick="mostraRegistro()">Mostra registro</button>
  <button onclick="esportaExcelPerGruppi()">Esporta in Excel (per Gruppi)</button>

 <table id="tabellaRegistro" style="display:none;">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Cognome</th>
        <th>Gruppo</th>
        <th>Data</th>
        <th>Ora</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- Firebase e script -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>

  <!-- INCOLLA QUESTA FUNZIONE QUI DIRETTAMENTE NELL'HTML -->
  <script>
    async function esportaExcelPerGruppi() {
      console.log("1. Pulsante cliccato, avvio esportazione...");

      // Controlla se la libreria c'è
      if (typeof XLSX === 'undefined') {
        alert("Errore critico: La libreria XLSX non è definita!");
        return;
      }

      try {
        console.log("2. Tentativo di connessione a Firebase Firestore...");
        const snapshot = await db.collection("presenze").get();
        
        console.log("3. Connessione riuscita! Trovati n° documenti:", snapshot.size);

        if (snapshot.empty) {
          alert("Il database è vuoto, non ci sono presenze da esportare.");
          return;
        }

        let datiPerGruppo = {};

        snapshot.forEach(doc => {
          const d = doc.data();
          let dataFormattata = "Data non valida";
          let oraFormattata = "";
          
          if (d.data) {
            const dateObj = d.data.toDate ? d.data.toDate() : new Date(d.data);
            if (!isNaN(dateObj)) {
              dataFormattata = dateObj.toLocaleDateString();
              oraFormattata = dateObj.toLocaleTimeString();
            }
          }

          let gruppoNome = d.gruppo ? d.gruppo.trim() : "Senza Gruppo";

          if (!datiPerGruppo[gruppoNome]) {
            datiPerGruppo[gruppoNome] = [
              ["Nome", "Cognome", "Gruppo", "Data", "Ora"]
            ];
          }

          datiPerGruppo[gruppoNome].push([
            d.nome || "", 
            d.cognome || "", 
            d.gruppo || "", 
            dataFormattata, 
            oraFormattata
          ]);
        });

        console.log("4. Dati organizzati per gruppo:", datiPerGruppo);

        let wb = XLSX.utils.book_new();

        for (let gruppo in datiPerGruppo) {
          let ws = XLSX.utils.aoa_to_sheet(datiPerGruppo[gruppo]);
          let nomeFoglioSafe = gruppo.substring(0, 31).replace(/[:\\\/?*\[\]]/g, "_");
          XLSX.utils.book_append_sheet(wb, ws, nomeFoglioSafe);
        }

        console.log("5. Generazione file e download in corso...");
        XLSX.writeFile(wb, "registro_presenze_per_gruppi.xlsx");
        console.log("6. Fatto!");

      } catch (err) {
        console.error("ERRORE CATTURATO:", err);
        alert("Errore durante l'esportazione. Guarda la console (F12) per i dettagli: " + err.message);
      }
    }
  </script>
